<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="05">
<title>05</title>
<style>
  /* instrument-design-05 — the specimen (docs/01, docs/02). Silent: no file in this folder opens a sound. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
         font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #f0ebe1; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  /* The top: CAMERA · MUSIC, two words, no box (docs/01 §4); PLAY, later STOP, at the right (docs/02 §3). */
  .top { position: fixed; top: calc(env(safe-area-inset-top) + 14px); font: 600 13px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
         letter-spacing: .14em; opacity: 0; pointer-events: none; transition: opacity .9s ease; }
  .top.on { opacity: 1; pointer-events: auto; }
  #modes { left: 0; right: 0; text-align: center; }
  @media (max-width: 430px) { .top { font-size: 12px; letter-spacing: .07em; } #modes button { padding: 10px 3px; } #modes .dot { padding: 0 1px; } }   /* three words and STOP on a phone */
  #modes button, #play { background: none; border: 0; padding: 10px 6px; margin: 0; font: inherit; letter-spacing: inherit;
         color: rgba(240, 235, 225, .32); cursor: pointer; transition: color .4s ease, text-shadow .4s ease; }
  #modes button.lit { color: #f0ebe1; text-shadow: 0 0 10px rgba(255, 220, 170, .45); }
  #modes .dot { color: rgba(240, 235, 225, .32); padding: 0 4px; }
  #play { right: calc(env(safe-area-inset-right) + 10px); color: #f0ebe1; text-shadow: 0 0 12px rgba(120, 255, 160, .55); }
  #play.top { position: fixed; padding: 10px 10px; }
  /* The gestures that work now, top left — bare words, no box (Marco, 2026-10-04: *"we use the top left to show the
     gestures that are current"*). A line lights while its gesture is used. */
  /* Readable over the paper (Marco: *"i cant read them - better ui"*): a little larger, each line on its own small dark
     band; the line in use lit warm. */
  #guide { position: fixed; left: calc(env(safe-area-inset-left) + 12px); top: calc(env(safe-area-inset-top) + 50px);
           font: 500 13px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .04em; pointer-events: none;
           opacity: 0; transition: opacity .6s ease; white-space: nowrap; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  #guide.on { opacity: 1; }
  #guide div { padding: 5px 9px; border-radius: 4px; background: rgba(8, 7, 6, .72); color: rgba(240, 235, 225, .86);
               transition: color .25s ease, background .25s ease; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  #guide div.lit { color: #1a1206; background: rgba(255, 206, 140, .92); }
  /* FULL, beside STOP, where a browser can fill the screen (docs/01 §16). */
  #full { left: calc(env(safe-area-inset-left) + 4px); }   /* the top left corner, clear of CAMERA · MUSIC on a phone */
  #full.top { position: fixed; padding: 10px 10px; background: none; border: 0; font: inherit; letter-spacing: inherit; color: rgba(240, 235, 225, .45); cursor: pointer; }
  #full.lit { color: #f0ebe1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="modes" class="top"><button id="mCamera">CAMERA</button><span class="dot">·</span><button id="mMusic" class="lit">MUSIC</button><span class="dot">·</span><button id="mLights">LIGHTS</button></div>
<button id="play" class="top">PLAY</button>
<button id="full" class="top">FULL</button>
<div id="guide"></div>
<script type="module">
import { createScore } from './score.js';
import * as M from './music.js';
import * as audio from './audio.js';

const $ = (id) => document.getElementById(id);
const canvas = $('c');
const score = createScore({ canvas });
const fit = () => score.resize(window.innerWidth, window.innerHeight);
window.addEventListener('resize', fit); fit();
// No page zoom on a pinch or a double-tap: the fingers belong to the instrument.
for (const ev of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });

// ─── The state ──────────────────────────────────────────────────────────────────────────────────
const SPB = 60 / M.BPM, LEAD = 2;                 // seconds a beat; the lead-in's beats (as 04)
let bootAt = null, clockT = performance.now() / 1000;   // seconds; the standby light's tap
let started = false, playing = false, lead = 1, now = 0, playAt = 0;   // the music's clock: the real one, from PLAY
let mode = 'music', selected = -1, shot = 0, shotNext = null;
const colour = new Array(M.NP).fill(0.6), drive = new Array(M.NP).fill(0), space = new Array(M.NP).fill(0.25), tension = new Array(M.NP).fill(0);
const echo = new Array(M.NP).fill(0);
const tensionHeld = new Array(M.NP).fill(false), tensionDropAt = new Array(M.NP).fill(null);
let tilt = { x: 0, y: 0 }, tilt0 = null;

// A fresh song, a fresh hand: the dub chord with its echo in a big space, the pad in a wide one (docs/02 §3).
function resetHand() {
  colour.fill(0.6); drive.fill(0); space.fill(0.25); echo.fill(0); tension.fill(0); tensionHeld.fill(false); tensionDropAt.fill(null);
  echo[M.CHORDS_PART] = 0.55; space[M.CHORDS_PART] = 0.6; space[6] = 0.45;
}
// What is heard and seen: the hand, inside the song's own colour (dark at the start, opening over the build), and the
// swell's rise on the chords and the pad.
const colourHeard = new Array(M.NP).fill(0.6), tensionHeard = new Array(M.NP).fill(0);
function heardHand() {
  const open = playing ? M.openAt(now) : 1, sw = playing ? M.swellAt(now) : 0;
  for (let p = 0; p < M.NP; p++) {
    colourHeard[p] = colour[p] * (0.45 + 0.55 * open);
    tensionHeard[p] = Math.max(tension[p], p === 5 || p === 6 ? 0.85 * sw : 0);
  }
  return { colour: colourHeard, drive, echo, space, tension: tensionHeard };
}
resetHand();
const boot = () => (bootAt == null ? null : clockT - bootAt);
const ready = () => boot() != null && boot() >= 3.5;
const nowBeat = () => now;
const clamp = (x) => Math.max(0, Math.min(1, x));
// What a gesture acts on: the selected part, or every part from the whole score (docs/01 §6.1).
const targets = () => (selected >= 0 ? [selected] : [...Array(M.NP).keys()]);

// ─── The top ────────────────────────────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  $('mCamera').classList.toggle('lit', m === 'camera'); $('mMusic').classList.toggle('lit', m === 'music'); $('mLights').classList.toggle('lit', m === 'lights');
  if (m === 'camera') askTilt();
}
// FULL — the whole screen, where the browser allows it (a computer, an iPad). An iPhone's Safari does not: there 05 fills
// the screen when opened from the Home Screen (the manifest), and FULL is not shown.
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const fsOk = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function toggleFull() {
  if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
}
$('full').addEventListener('click', toggleFull);
for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) document.addEventListener(ev, () => { $('full').classList.toggle('lit', !!fsEl()); fit(); });

// THE MARKS — what the hand did, written into the score at the bar it is heard (docs/01 §16). One of a kind per staff
// per bar: a newer one replaces it.
const marks = [];
function mark(kind, staff, bar, extra = {}) {
  const at = bar * M.BAR * 4, key = `${kind}:${staff}:${bar}`;
  const i = marks.findIndex((m) => m.key === key);
  const m = { key, kind, staff, at, born: i >= 0 ? marks[i].born : clockT, ...extra };
  if (extra.to != null) m.to = extra.to * M.BAR * 4;
  if (i >= 0) marks[i] = m; else marks.push(m);
  while (marks.length > 160) marks.shift();
}
const barNext = () => Math.floor(now / M.BAR + 1e-6) + 1;
const staffOrAll = () => (selected >= 0 ? selected : -1);
function markSignal(which) {
  const st = staffOrAll(), b = barNext(), q = selected >= 0 ? selected : 0;
  if (which === 'drive') { if (drive[q] > 0.05) mark('drive', st, b, { text: drive[q] > 0.55 ? 'ff' : 'f' }); }
  else mark(which === 'echo' ? 'eco' : 'spazio', st, b, { to: b + 2 });
}
$('mCamera').addEventListener('click', () => setMode('camera'));
$('mMusic').addEventListener('click', () => setMode('music'));
$('mLights').addEventListener('click', () => setMode('lights'));

// ─── LIGHTS (docs/01 §17, Marco: *"now we need lights"*) — the rig played as a lighting desk ─────
// colour warm 0 → cool 1 · brightness · turn (the key light round the score) · beam narrow 0 → wide 1 · a spot per
// staff · chase while held · blackout, landing on the next bar · scenes, swiped. The values here; score.js eases them.
const SCENES = [
  { hue: 0.15, bright: 0.6, turn: 0, beam: 0.5, spots: [], disco: false, ball: false },          // as it opens: warm, from the front
  { hue: 0.85, bright: 0.35, turn: 1.6, beam: 0.25, spots: [5, 6], disco: false, ball: false },  // cool and low, a narrow light from the side, the chords and the pad lit
  { hue: 0.55, bright: 0.5, turn: -0.7, beam: 0.85, spots: [0, 4], disco: true, ball: true },    // the coloured pools and the mirror ball, the kick and the bass lit
  { hue: 0.03, bright: 0.75, turn: 2.8, beam: 1, spots: [], disco: false, ball: false },          // amber and wide, from behind
];
const light = { hue: 0.15, bright: 0.6, turn: 0, beam: 0.5, chase: false, black: false, spots: new Array(M.NP).fill(false), scene: 0, disco: false, ball: false, cursor: -1 };
let blackAt = null;                                // the beat a blackout (or its end) lands on
function scene(dir) {
  light.scene = (light.scene + dir + SCENES.length) % SCENES.length;
  const sc = SCENES[light.scene];
  Object.assign(light, { hue: sc.hue, bright: sc.bright, turn: sc.turn, beam: sc.beam, disco: sc.disco, ball: sc.ball });
  light.spots.fill(false); for (const p of sc.spots) light.spots[p] = true;
  flash('scene');
}
function resetLight() { light.scene = 1; scene(-1); light.chase = false; light.black = false; blackAt = null; light.cursor = -1; }
const lightBy = (k, d) => { light[k] = k === 'turn' ? Math.max(-Math.PI, Math.min(Math.PI, light[k] + d)) : clamp(light[k] + d); flash(k === 'hue' ? 'lcolour' : k); };
function spot(p) { if (p < 0) return; light.spots[p] = !light.spots[p]; flash('spot'); }
function blackout() { blackAt = barNext() * M.BAR; flash('black'); }
function chaseOn() { light.chase = true; flash('chase'); }
function chaseOff() { light.chase = false; }   // the light starts as the first scene; PLAY sets it again (resetLight)
$('play').addEventListener('click', () => {
  if (!playing) {
    M.reset(); resetHand(); resetLight(); marks.length = 0; now = 0; lead = 0; playAt = clockT; playing = true; started = true;
    audio.start(LEAD, heardHand);   // the sound starts here, and only here
    $('play').textContent = 'STOP'; $('modes').classList.add('on');
  } else {
    audio.stop();
    playing = false; lead = 1; selected = -1; shot = 0; shotNext = null;
    tension.fill(0); tensionHeld.fill(false);
    $('play').textContent = 'PLAY';
  }
});

// LEAVING — the phone locks, a call, another app: the music fades out over a bar and stops; PLAY starts it
// again. Nothing plays in the background (docs/02 §11).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden' || !playing) return;
  audio.stop(M.BAR * SPB);
  playing = false; lead = 1; selected = -1; shot = 0; shotNext = null; tension.fill(0); tensionHeld.fill(false);
  $('play').textContent = 'PLAY';
});

// ─── The phone's tilt (docs/01 §5) — asked once, on CAMERA, as iPhone wants a tap for it ────────
let tiltAsked = false;
async function askTilt() {
  if (tiltAsked) return; tiltAsked = true;
  try { if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) { if (await DeviceOrientationEvent.requestPermission() !== 'granted') return; } } catch { return; }
  window.addEventListener('deviceorientation', (e) => {
    if (e.beta == null || e.gamma == null) return;
    if (!tilt0) tilt0 = { b: e.beta, g: e.gamma };
    const nt = { x: Math.max(-1, Math.min(1, (e.gamma - tilt0.g) / 30)), y: Math.max(-1, Math.min(1, (e.beta - tilt0.b) / 30)) };
    if (mode === 'camera' && Math.hypot(nt.x - tilt.x, nt.y - tilt.y) > 0.02) flash('lean');
    tilt = nt;
  });
}

// ─── The gestures that work now, top left ────────────────────────────────────────────────────────
// Per input — the one used last: touch, mouse, keys or the PS5 controller (Marco, 2026-10-04: *"touch, mouse and
// keyboard and also ps5 controller"*).
const GUIDE = {
  touch: {
    whole: [['select', 'tap staff · select'], ['grow', 'swipe → ← · grow / ungrow'], ['break', 'drag down · break'], ['signal', '2 fingers · signal']],
    staff: [['colour', 'slide ↔ · colour'], ['more', 'slide ↕ · more / less'], ['tension', 'hold · tension'], ['drive', 'push · drive'], ['echo', 'twist · echo'], ['space', 'spread · space'], ['back', 'tap empty · back']],
    chords: [['next', 'tap chord · next']],
    camera: [['turn', 'drag · turn'], ['zoom', 'pinch · zoom'], ['move', '2 fingers · move'], ['shot', 'double-tap · shot'], ['lean', 'tilt · lean']],
    lights: [['lcolour', 'drag ↔ · colour'], ['bright', 'drag ↕ · brightness'], ['spot', 'tap staff · spot'], ['turn', 'twist · turn'], ['beam', 'spread · beam'], ['chase', 'hold · chase'], ['black', 'double-tap · blackout'], ['scene', 'swipe ← → · scene']],
  },
  mouse: {
    whole: [['select', 'click staff · select'], ['grow', 'drag → ← · grow / ungrow'], ['break', 'drag down · break'], ['signal', 'scroll · signal']],
    staff: [['colour', 'drag ↔ · colour'], ['more', 'drag ↕ · more / less'], ['tension', 'hold button · tension'], ['drive', 'scroll ↕ · drive'], ['echo', 'shift + scroll · echo'], ['space', 'alt + scroll · space'], ['back', 'click empty · back']],
    chords: [['next', 'click chord · next']],
    camera: [['turn', 'drag · turn'], ['zoom', 'scroll · zoom'], ['move', 'right-drag · move'], ['shot', 'double-click · shot']],
    lights: [['lcolour', 'drag ↔ · colour'], ['bright', 'drag ↕ · brightness'], ['spot', 'click staff · spot'], ['turn', 'scroll · turn'], ['beam', 'alt + scroll · beam'], ['chase', 'hold button · chase'], ['black', 'double-click · blackout'], ['scene', 'flick ← → · scene']],
  },
  keys: {
    whole: [['select', '1–8 · select'], ['grow', '→ ← · grow / ungrow'], ['break', 'hold ↓ · break'], ['signal', 'D E S + ↑ ↓ · signal'], ['mode', 'tab · camera']],
    staff: [['colour', '← → · colour'], ['more', '↑ ↓ · more / less'], ['tension', 'hold space · tension'], ['drive', 'D + ↑ ↓ · drive'], ['echo', 'E + ↑ ↓ · echo'], ['space', 'S + ↑ ↓ · space'], ['back', 'esc · back']],
    chords: [['next', 'N · next chord']],
    camera: [['turn', 'arrows · turn'], ['zoom', '+ − · zoom'], ['move', 'shift + arrows · move'], ['shot', 'N · shot'], ['mode', 'tab · lights']],
    lights: [['lcolour', '← → · colour'], ['bright', '↑ ↓ · brightness'], ['spot', '1–8 · spot'], ['turn', 'Q E · turn'], ['beam', 'S W · beam'], ['chase', 'hold space · chase'], ['black', 'B · blackout'], ['scene', '[ ] · scene'], ['mode', 'tab · music']],
  },
  pad: {
    whole: [['select', 'L1 R1 · select'], ['grow', 'd-pad → ← · grow / ungrow'], ['break', 'hold L2 · break'], ['drive', 'R2 · drive'], ['signal', 'right stick · echo / space']],
    staff: [['colour', 'left stick ↔ · colour'], ['more', 'left stick ↕ · more / less'], ['tension', 'hold □ · tension'], ['drive', 'R2 · drive'], ['echo', 'right stick ↔ · echo'], ['space', 'right stick ↕ · space'], ['back', '○ · back']],
    chords: [['next', 'd-pad + ✕ · next chord']],
    camera: [['turn', 'left stick · turn'], ['move', 'right stick · move'], ['zoom', 'R2 L2 · zoom'], ['shot', '△ · shot']],
    lights: [['lcolour', 'left stick ↔ · colour'], ['bright', 'left stick ↕ · brightness'], ['spot', 'L1 R1 + ✕ · spot'], ['turn', 'right stick ↔ · turn'], ['beam', 'right stick ↕ · beam'], ['chase', 'hold □ · chase'], ['black', '△ · blackout'], ['scene', 'd-pad ← → · scene']],
  },
};
let input = matchMedia('(pointer: coarse)').matches ? 'touch' : 'mouse';
const litUntil = {};
let guideKey = '';
function flash(k) { litUntil[k] = clockT + 0.6; }
function drawGuide() {
  const el = $('guide');
  const G = GUIDE[input];
  const lines = !playing ? [] : mode === 'camera' ? G.camera : mode === 'lights' ? G.lights : selected < 0 ? G.whole : selected === M.CHORDS_PART ? [...G.staff, ...G.chords] : G.staff;
  const key = input + ':' + lines.map(([k]) => k + (litUntil[k] > clockT ? '*' : '')).join(',');
  if (key === guideKey) return;
  guideKey = key;
  el.classList.toggle('on', lines.length > 0);
  el.replaceChildren(...lines.map(([k, t]) => { const d = document.createElement('div'); d.textContent = t; if (litUntil[k] > clockT) d.className = 'lit'; return d; }));
}

// ─── What every input does — one set of actions ────────────────────────────────────────────────
function select(p) { if (!playing || mode !== 'music') return; selected = p; flash('select'); }
function back() { if (selected >= 0) { selected = -1; flash('back'); } }
function switchOn() { if (bootAt == null) bootAt = clockT; }
function toggleMode() { if (playing) { setMode(mode === 'music' ? 'camera' : mode === 'camera' ? 'lights' : 'music'); flash('mode'); } }
function growNow() {
  if (!playing || mode !== 'music') return;
  const p = M.grow(nowBeat()); flash('grow');
  if (p != null) mark('cresc', p, M.enterOf(p), { to: M.enterOf(p) + 8 });   // a hairpin over its eight bars
}
function ungrowNow() {
  if (!playing || mode !== 'music') return;
  const b = barNext(), p = M.ungrow(nowBeat()); flash('grow');
  if (p != null) mark('decresc', p, b, { to: b + 8 });
}
let breaking = false;
function breakOn() { if (playing && !breaking) { breaking = true; M.breakdown(nowBeat()); mark('dim', -1, barNext()); } flash('break'); }
function breakOff() { if (breaking) { breaking = false; if (playing) { M.drop(nowBeat()); mark('subito', -1, barNext()); } } }
function tensionOn() { if (selected < 0) return; tensionHeld[selected] = true; tensionDropAt[selected] = null; flash('tension'); mark('fermata', selected, Math.floor(now / M.BAR + 1e-6)); }
function tensionOff() { for (let p = 0; p < M.NP; p++) if (tensionHeld[p]) { tensionHeld[p] = false; tensionDropAt[p] = barNext() * M.BAR; mark('atempo', p, barNext()); } }   // back on the next bar's one
// More or less, by a little: the wish kept, heard from the next bar once it differs enough.
let moreWish = null;
function moreBy(d) {
  if (selected < 0) return;
  if (moreWish == null || moreWish.p !== selected) moreWish = { p: selected, v: M.moreOf(selected, nowBeat()) };
  moreWish.v = clamp(moreWish.v + d);
  if (Math.abs(moreWish.v - M.moreOf(selected, nowBeat())) > 0.04) M.setMore(selected, moreWish.v, nowBeat());
  flash('more');
}
function colourBy(d) { if (selected < 0) return; colour[selected] = clamp(colour[selected] + d); flash('colour'); }
// The signal by a little, on the selected part or the whole mix.
function signalBy(which, d) {
  const arr = which === 'drive' ? drive : which === 'echo' ? echo : space;
  for (const q of targets()) arr[q] = clamp(arr[q] + d);
  flash(selected < 0 ? 'signal' : which);
  markSignal(which);
}
let cursor = 0;                                    // the next chord the keys or the d-pad point at
function chordStep(dir) { if (!choices) return; cursor = (cursor + dir + choices.chords.length) % choices.chords.length; }
function chordPick(i = cursor) { if (!choices) return; M.pickChord(choices.bar, choices.names[i]); flash('next'); mark('chord', M.CHORDS_PART, choices.bar, { text: choices.names[i] }); }
function nextShot() { shotNext = (shot + 1) % 4; flash('shot'); }

// ─── The fingers ────────────────────────────────────────────────────────────────────────────────
const pts = new Map();                             // pointerId → { x, y, x0, y0, t0 }
let g = null;                                      // the gesture under way
let lastTap = { t: 0, x: 0, y: 0 }, lastSpot = -1;
const TAP_MOVE = 10, TAP_MS = 280, HOLD_MS = 450;

function two() { const [a, b] = [...pts.values()]; return { cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, d: Math.hypot(b.x - a.x, b.y - a.y), ang: Math.atan2(b.y - a.y, b.x - a.x) }; }

canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointerdown', (e) => {
  input = e.pointerType === 'mouse' ? 'mouse' : 'touch';
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t0: performance.now() });
  if (!ready()) { if (pts.size === 1) g = { kind: 'standby' }; return; }
  if (pts.size === 1) {
    g = { kind: 'one', moved: false, t0: performance.now(), lastX: e.clientX, lastY: e.clientY, vx: 0, vy: 0, lastT: performance.now(),
          more0: selected >= 0 ? M.moreOf(selected, nowBeat()) : 0, dy: 0, down: false, held: false };
    if (mode === 'camera') { score.hold(true); if (e.pointerType === 'mouse' && (e.button === 2 || e.shiftKey)) g.pan = true; }   // right-drag or shift-drag: move
    else if (mode === 'lights') { g.hue0 = light.hue; g.bright0 = light.bright; g.holdTimer = setTimeout(() => { if (g && g.kind === 'one' && !g.moved) { g.held = true; chaseOn(); } }, HOLD_MS); }
    else if (selected >= 0) g.holdTimer = setTimeout(() => { if (g && g.kind === 'one' && !g.moved) { g.held = true; tensionOn(); } }, HOLD_MS);
  } else if (pts.size === 2) {
    endOne(false);
    const t = two(); g = { kind: 'two', ...t, last: t };
  }
});
canvas.addEventListener('pointermove', (e) => {
  const p = pts.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (!g) return;
  if (g.kind === 'one') {
    const tn = performance.now(), dtm = Math.max(1, tn - g.lastT);
    g.vx = g.vx * 0.6 + (dx / dtm * 1000) * 0.4; g.vy = g.vy * 0.6 + (dy / dtm * 1000) * 0.4; g.lastT = tn;

canvas.addEventListener('pointercancel', up);

function tap(x, y) {

// ─── The mouse's wheel and the trackpad ─────────────────────────────────────────────────────────
// MUSIC: scroll ↕ drive · shift + scroll (or sideways on a trackpad) echo · alt + scroll (or a trackpad pinch) space;

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();

  if (Math.abs(dx) > Math.abs(dy)) signalBy('echo', dx * 0.002); else signalBy('drive', -dy * 0.002);

// ─── The keys ───────────────────────────────────────────────────────────────────────────────────
const keys = new Set();

window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey) return;

  if (mode === 'lights') { if (k >= '1' && k <= '8') spot(+k - 1); if (k === ' ') chaseOn(); if (k === 'b') blackout(); if (k === '[') scene(-1); if (k === ']') scene(1); return; }

window.addEventListener('keyup', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;

window.addEventListener('blur', () => { keys.clear(); tensionOff(); breakOff(); });
// Held keys act every frame.
function keysFrame(dt) {

  if (mode === 'camera') {
    if (ax || ay) { if (keys.has('Shift')) { score.pan(-ax * 420 * dt, ay * 420 * dt); flash('move'); } else { score.orbit(ax * 260 * dt, -ay * 200 * dt); flash('turn'); } }

    if (z) { score.pinch(Math.exp(z * 1.2 * dt)); flash('zoom'); }
    return;
  }
  if (mode === 'lights') {
    if (ax) lightBy('hue', ax * 0.5 * dt); if (ay) lightBy('bright', ay * 0.5 * dt);
    const tq = (keys.has('e') ? 1 : 0) - (keys.has('q') ? 1 : 0), bw = (keys.has('w') ? 1 : 0) - (keys.has('s') ? 1 : 0);

  if (which) { if (ay) signalBy(which, ay * 0.6 * dt); return; }

// ─── The PS5 controller (the browser's standard mapping) ────────────────────────────────────────
// ✕ 0 · ○ 1 · □ 2 · △ 3 · L1 4 · R1 5 · L2 6 · R2 7 · Options 9 · d-pad ← 14 → 15 · touchpad 17; sticks 0–3.
// A browser does not count a controller's buttons as a tap: on some, the first PLAY has to be a tap or a click.

  if (playing) {
    if (edge(17)) toggleMode();

      if (rx) lightBy('turn', rx * 1.6 * dt); if (ry) lightBy('beam', -ry * 0.6 * dt);
      if (edge(4)) { light.cursor = light.cursor <= 0 ? M.NP - 1 : light.cursor - 1; flash('spot'); }

// ─── The frame ──────────────────────────────────────────────────────────────────────────────────

    if (Array.isArray(e.midi)) out.push({ lane, t, at, len, fs: e.midi.map(hz) });

    level: (p) => (playing ? M.levelOf(p, now) : 0), off: (p) => playing && M.levelOf(p, now) === 0,

requestAnimationFrame(frame);
// For looking at the specimen from outside — silent, as everything here.
window.__specimen = { score, M, get now() { return now; }, get selected() { return selected; }, set selected(v) { selected = v; }, get mode() { return mode; }, setMode, colour, drive, echo, space, tension, tapAt: tap,
